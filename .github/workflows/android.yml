name: Android Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@1a4442cacd436585916779262731d5b162bc6ec7 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          if [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          fi

      - name: Prepare environment and signing keystore
        shell: bash
        run: |
          set -e

          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
              > "$GITHUB_WORKSPACE/my-upload-key.jks"

          elif [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "Decoding SIGNING_KEY..."
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode \
              > "$GITHUB_WORKSPACE/my-upload-key.jks"

          else
            echo "Generating temporary release keystore..."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
              -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" \
              -alias "${{ secrets.KEY_ALIAS || 'upload' }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ChatMesh,O=P2P,C=US"
          fi

          chmod +x ./gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android'upload' }}
        run: |
          ./gradlew clean assembleRelease --stacktrace

      - name: Prepare APK files
        shell: bash
        run: |
          set -e

          mkdir -p release-output

          APK_PATH="$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "Error: No se encontró ninguna APK."
            exit 1
          fi

          echo "APK encontrada: $APK_PATH"

          cp "$APK_PATH" release-output/ChatMesh-release.apk
          cp "$APK_PATH" \
            "release-output/ChatMesh-v1.0.${{ github.run_number }}.apk"

          sha256sum release-output/*.apk > release-output/SHA256SUMS.txt

          echo "Archivos generados:"
          ls -lh release-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ChatMesh-APK-Release-${{ github.run_number }}
          path: release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v1.0.${{ github.run_number }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" \
            release-output/ChatMesh-release.apk \
            "release-output/ChatMesh-v1.0.${{ github.run_number }}.apk" \
            release-output/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --title "ChatMesh $TAG_NAME" \
            --generate-notes \
            --notes "APK de ChatMesh generada desde el commit ${{ github.sha }}."