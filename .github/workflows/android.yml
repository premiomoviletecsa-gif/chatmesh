name: Android Build & Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "${ANDROID_HOME}/tools/bin/sdkmanager" --licenses || true

      - name: Prepare environment and Keystore
        run: |
          # 1. Prepare .env file for secrets plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Extract release keystore from repository secrets
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding KEYSTORE_BASE64 secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          elif [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "Decoding SIGNING_KEY secret..."
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          elif [ -f debug.keystore.base64 ]; then
            echo "Using base64 fallback keystore..."
            base64 -d debug.keystore.base64 > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          else
            echo "Generating fallback keystore for release..."
            keytool -genkey -v -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" \
              -alias "${{ secrets.KEY_ALIAS || 'upload' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ChatMesh,O=P2P,C=US"
          fi

          # 3. Ensure Gradle wrapper execution rights
          chmod +x ./gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Locate and prepare APK
        run: |
          mkdir -p release-output
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$RELEASE_APK" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi

          echo "Found release APK: $RELEASE_APK"
          cp "$RELEASE_APK" release-output/ChatMesh-release.apk
          cp "$RELEASE_APK" "release-output/ChatMesh-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatMesh-APK-Release-${{ github.run_number }}
          path: release-output/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ChatMesh v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📱 ChatMesh Release APK (Build ${{ github.run_number }})
            
            Compilación automática de la APK firmada generada a partir del commit `${{ github.sha }}` en la rama `main`.
            
            #### 📥 Descarga de la APK:
            - **[ChatMesh-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/ChatMesh-release.apk)**
            
            #### ✨ Características:
            - 📶 **Red en Malla P2P:** Funciona 100% sin Internet mediante WiFi Direct y WiFi Aware.
            - 📇 **SSID Automático:** Creado a partir del número de la SIM activa (`ChatMesh_+...`).
            - 💬 **Chat Estilo WhatsApp:** Mensajes de texto, fotos, notas de voz con reproductor y archivos.
            - 📞 **Llamadas y Videollamadas P2P:** Comunicación cifrada directa entre nodos.
            - 🗄️ **Base de datos Room:** Sincronización descentralizada y soporte Store & Forward.
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
